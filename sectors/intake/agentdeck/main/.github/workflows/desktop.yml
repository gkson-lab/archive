name: Desktop app

# Builds the installers for macOS, Windows and Linux and publishes them as a GitHub release.
# - Every push to main: makes (or updates) the release v<version from package.json>.
#   Bump "version" in package.json to cut a new release.
# - Publishing a release by hand, or pushing a v* tag: attaches the installers to that release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Windows, os: windows-latest, target: --win }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: agentdeck ${{ steps.tag.outputs.name }}
          files: out/*
          overwrite_files: true
          make_latest: true
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | Mac with Apple silicon (M1 and later) | `agentdeck-*-mac-arm64.dmg` |
            | Mac with Intel | `agentdeck-*-mac-x64.dmg` |
            | Windows | `agentdeck-*-win-x64.exe` (ARM PCs: `-arm64.exe`) |
            | Linux | `agentdeck-*-linux-x86_64.AppImage` or `agentdeck-*-linux-amd64.deb` |

            You also need [Claude Code](https://code.claude.com) installed (the `claude` command); agentdeck uses it to sign you in and run agents.

            **First launch** (the app isn't signed with an Apple or Microsoft certificate yet):
            - **macOS:** if it says the app can't be opened, go to System Settings → Privacy & Security → **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/agentdeck.app`.
            - **Windows:** on the SmartScreen prompt, click **More info → Run anyway**.
            - **Linux:** `chmod +x agentdeck-*.AppImage`, then run it; or `sudo apt install ./agentdeck-*.deb`.
          generate_release_notes: true
